services:
  - type: web
    name: moviesboxhd-api
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: BASE_URL
        value: https://allmovieland.link/player.js?v=60%20128
      - key: RATE_LIMIT
        value: true
      - key: PORT
        value: 3000
